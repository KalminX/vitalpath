version: '3.8'

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: vitalpath_db
      POSTGRES_USER: vitalpath_user
      POSTGRES_PASSWORD: vitalpath_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  web:
    build: .
    command: >
      sh -c "python manage.py migrate &&
             python manage.py seed_demo &&
             gunicorn vitalpath.wsgi:application --bind 0.0.0.0:8000 --workers 3"
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - DEBUG=True
      - SECRET_KEY=django-insecure-vitalpath-docker-test-secret-key-2026
      - DATABASE_URL=postgres://vitalpath_user:vitalpath_password@db:5432/vitalpath_db
      - ALLOWED_HOSTS=localhost,127.0.0.1,0.0.0.0
      - SITE_URL=http://127.0.0.1:8000
    depends_on:
      - db

volumes:
  postgres_data:
