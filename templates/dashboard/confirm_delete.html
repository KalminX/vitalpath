{% extends 'base_dashboard.html' %}

{% block page_title %}Confirm Deletion{% endblock %}

{% block dashboard_content %}
<div class="max-w-md mx-auto py-12">
    <div class="bg-white rounded-3xl border border-stone-200 shadow-sm p-8 text-center space-y-6">
        <div class="w-14 h-14 rounded-2xl bg-rose-50 text-rose-600 flex items-center justify-center mx-auto">
            <i data-lucide="trash-2" class="w-7 h-7"></i>
        </div>
        
        <div class="space-y-2">
            <h2 class="font-display font-bold text-xl text-stone-900">Delete {{ type }}: {{ object }}?</h2>
            <p class="text-xs text-stone-500">This action cannot be undone. Are you sure you want to permanently remove this record?</p>
        </div>

        <form method="POST" class="pt-4 flex items-center justify-center gap-3">
            {% csrf_token %}
            <button type="submit" class="px-6 py-2.5 rounded-xl bg-rose-600 hover:bg-rose-700 text-white font-semibold text-xs transition">
                Confirm Delete
            </button>
            <a href="javascript:history.back()" class="px-5 py-2.5 rounded-xl border border-stone-200 text-stone-700 font-semibold text-xs hover:bg-stone-50 transition">
                Cancel
            </a>
        </form>
    </div>
</div>
{% endblock %}
