{% extends 'base.html' %}

{% block title %}Page Not Found (404) | VitalPath Education{% endblock %}

{% block content %}
<section class="py-20 md:py-32 bg-[#FAFAF8] text-center">
    <div class="max-w-md mx-auto px-4 space-y-6">
        <div class="w-16 h-16 rounded-2xl bg-stone-100 text-stone-500 flex items-center justify-center mx-auto">
            <i data-lucide="file-question" class="w-8 h-8"></i>
        </div>
        <div class="space-y-2">
            <span class="text-xs font-mono font-bold text-emerald-800">ERROR 404</span>
            <h1 class="text-3xl font-display font-bold text-stone-900">Page Not Found</h1>
            <p class="text-xs text-stone-600 leading-relaxed">
                The educational resource or curriculum page you are looking for does not exist or has been moved.
            </p>
        </div>
        <div class="pt-2">
            <a href="{% url 'core:home' %}" class="inline-flex items-center space-x-2 px-6 py-3 rounded-xl bg-stone-900 text-white font-semibold text-xs hover:bg-emerald-800 transition">
                <i data-lucide="home" class="w-3.5 h-3.5"></i>
                <span>Return to Homepage</span>
            </a>
        </div>
    </div>
</section>
{% endblock %}
